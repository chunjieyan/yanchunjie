name: Validate release sources
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check file bytes, archived sources, syntax and experiment matrix
        run: python tools/validate_release.py
      - name: Check synthetic result registration and numerical comparison contracts
        run: python tests/test_result_contracts.py
